[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jingwei-zhizao"
version = "0.1.8"
description = "花楼提花机可编程密码桌面交互教学软件"
requires-python = ">=3.14"
dependencies = [
    "PySide6-Essentials==6.11.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
package = [
    "pyinstaller==6.22.3",
]