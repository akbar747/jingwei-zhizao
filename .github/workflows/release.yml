name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pyinstaller==6.22.3"
          python -c "import PySide6, PyInstaller; print('PySide6 and PyInstaller import ok')"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build release assets
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          try {
            .\scripts\build_release.ps1 -Version $version
          } catch {
            $message = $_.Exception.Message
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Release build failed"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $message
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            }
            Write-Host "::error title=Build release assets failed::$message"
            throw
          }

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-diagnostics
          path: |
            build/**/*.log
            build/**/*.txt
          if-no-files-found: warn
          include-hidden-files: true

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          gh release create $tag `
            "release\JingweiZhizao-Setup-$version.exe" `
            "release\JingweiZhizao-Portable-$version.zip" `
            "release\SHA256SUMS.txt" `
            --title "经纬智造 $tag" `
            --notes-file "docs\releases\$tag.md"